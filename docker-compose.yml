services:
  postgres:
    image: postgres:16
    container_name: weatherservice-postgres
    restart: always
    environment:
      POSTGRES_DB: weatherapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: weatherapp123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d weatherapp" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: weatherservice-redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: weatherservice-backend:1.0
    container_name: weatherservice-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
          condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  frontend:
    build: ./frontend
    image: weatherservice-frontend:1.0
    container_name: weatherservice-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  postgres_data: